name: Security reporting instructions
description: Do not use public issues for vulnerabilities; follow SECURITY.md for private reporting.
body:
  - type: markdown
    attributes:
      value: |
        ## Private security reporting only

        Do **not** use this public issue form to report suspected vulnerabilities.
        Public issues can disclose that a security problem may exist, even without exploit details.

        Please follow the private reporting process documented in `SECURITY.md`.
